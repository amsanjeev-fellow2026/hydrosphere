<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hydrosphere – The Great Water Rescue</title>
<style>
:root{--navy:#082f55;--blue:#1273b8;--turq:#14b8b8;--aqua:#a8ecf0;--coral:#ff6f61;--sun:#ffd23f;--white:#fff;--green:#1f9d61}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:min(1.25vw,2.2vh)}
@media (orientation:portrait){html{font-size:2.1vw}}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;background:var(--navy);color:var(--navy);user-select:none;-webkit-user-select:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:1rem;background:var(--white);padding:.7rem 1.3rem;font-weight:bold;min-height:3rem;box-shadow:0 .25rem 0 rgba(0,0,0,.25);touch-action:manipulation}
button:active{transform:translateY(.15rem);box-shadow:0 .1rem 0 rgba(0,0,0,.25)}
button:focus-visible,input:focus-visible{outline:.25rem solid var(--coral)}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--sun);font-size:1.5rem;padding:.9rem 2.4rem}
.danger{background:var(--coral);color:#fff}
.on{background:var(--turq);color:#fff}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:.7rem;padding:.4rem .8rem;background:var(--navy);color:#fff;flex:none;z-index:5}
#bar button{min-height:2.6rem;padding:.3rem .9rem}
#bar button{color:var(--navy)}
#who{font-size:1.5rem;font-weight:bold;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.stat{background:rgba(255,255,255,.14);border-radius:2rem;padding:.35rem .9rem;font-weight:bold;white-space:nowrap}
#dots{display:flex;gap:.35rem;margin:0 auto}
#dots i{width:1.5rem;height:1.5rem;border-radius:50%;border:.15rem solid #fff;font:bold .85rem/1.2rem sans-serif;text-align:center;font-style:normal}
#dots i.d{background:var(--turq)}#dots i.c{background:var(--sun);color:var(--navy)}
#view{flex:1;position:relative;overflow:hidden;background:linear-gradient(#bdeefa,#5fc8dc 60%,#1783b8)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1rem;text-align:center;overflow:auto}
.card{background:#fff;border-radius:1.6rem;padding:1.3rem 1.8rem;box-shadow:0 .6rem 1.6rem rgba(4,40,70,.3);max-width:62rem;animation:pop .35s ease}
h1{font-size:3.6rem;line-height:1.05;color:var(--navy)}h2{font-size:2.2rem}h3{font-size:1.4rem}
p{font-size:1.35rem;line-height:1.4}
.small{font-size:1.05rem}
.row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:.7rem;align-items:center}
.err{color:#b3261e;font-weight:bold}
input#code{font-size:2rem;text-align:center;text-transform:uppercase;letter-spacing:.15em;width:15rem;border:.2rem solid var(--blue);border-radius:1rem;padding:.4rem}
/* activity layout */
.act{position:absolute;inset:0;display:flex;flex-direction:column;padding:.6rem .9rem;gap:.5rem}
.ask{background:#fff;border-radius:1rem;padding:.55rem 1rem;font-size:1.45rem;font-weight:bold;text-align:center;flex:none;box-shadow:0 .2rem .6rem rgba(4,40,70,.2)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;gap:1rem}
.tray{flex:none;display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;min-height:4rem;align-items:center}
.stage>svg{width:100%;height:100%}
.tile{background:var(--sun);border-radius:.9rem;padding:.7rem 1.2rem;font-weight:bold;font-size:1.3rem;touch-action:none;cursor:grab;box-shadow:0 .25rem 0 rgba(0,0,0,.25);max-width:22rem;text-align:center}
.tile.sel{background:var(--coral);color:#fff;transform:scale(1.06)}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg)}
.zones{display:grid;gap:.7rem;width:100%;height:100%}
.zone{background:#fff;border:.25rem dashed var(--blue);border-radius:1.1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.4rem;text-align:center;font-weight:bold;font-size:1.2rem;min-height:0;overflow:hidden;cursor:pointer}
.zone svg{flex:1;min-height:0;width:100%}
.zone .got{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center}
.zone .got b{background:var(--turq);color:#fff;border-radius:.6rem;padding:.2rem .6rem;animation:pop .3s}
.zone.full{border-style:solid;border-color:var(--green)}
.glow{animation:glow .6s ease 4}
@keyframes glow{50%{filter:drop-shadow(0 0 1rem var(--coral)) brightness(1.15);border-color:var(--coral)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-.5rem)}75%{transform:translateX(.5rem)}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
@keyframes rise{to{transform:translateY(-110vh)}}
@keyframes fall{from{transform:translateY(-30px);opacity:0}30%{opacity:1}to{transform:translateY(90px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-60}}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 2.6s ease-in-out infinite}.drift{animation:drift 9s ease-in-out infinite alternate}
.flow{stroke-dasharray:14 16;animation:flow 1s linear infinite}
.fall{animation:fall 1.1s linear infinite}
.spin{animation:spin 24s linear infinite;transform-origin:center;transform-box:fill-box}
.bubble{position:absolute;bottom:-3rem;border-radius:50%;border:.12rem solid rgba(255,255,255,.8);animation:rise linear infinite;pointer-events:none}
#fb{position:absolute;left:50%;bottom:.7rem;transform:translateX(-50%);width:min(94%,60rem);border-radius:1.1rem;padding:.8rem 1.2rem;font-size:1.3rem;font-weight:bold;text-align:center;color:#fff;z-index:20;pointer-events:none;box-shadow:0 .4rem 1rem rgba(0,0,0,.35);animation:pop .25s}
#fb.good{background:var(--green)}#fb.bad{background:#a8362d}
#learn,#modal{position:absolute;inset:0;background:rgba(4,30,55,.72);display:flex;align-items:center;justify-content:center;z-index:30;padding:1rem}
#modal{position:fixed;z-index:60}
#modal .card{max-height:94vh;overflow:auto;text-align:center;min-width:min(30rem,90vw)}
.node{cursor:pointer}.node.lock{cursor:default;opacity:.55}
table{border-collapse:collapse;width:100%;font-size:1.1rem}td,th{border-bottom:1px solid #bcd;padding:.35rem .7rem;text-align:left}
.badge{background:var(--aqua);border-radius:2rem;padding:.4rem 1rem;font-weight:bold;font-size:1.1rem}
.bigname{font-size:6rem;font-weight:bold;color:var(--blue);line-height:1.1;word-break:break-word}
.confetti{position:fixed;top:-2rem;width:.8rem;height:1.2rem;z-index:70;pointer-events:none;animation:conf 2.8s linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
/* animated home scene */
.scene{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.scene i{position:absolute;font-style:normal;line-height:1;will-change:transform}
.scene i b{display:block;font-weight:normal}
.goR{left:-14vw;animation:goR linear infinite}.goL{left:106vw;animation:goL linear infinite}
@keyframes goR{to{transform:translateX(125vw)}}@keyframes goL{to{transform:translateX(-125vw)}}
.goR b,.goL b{animation:swim 2.4s ease-in-out infinite}.goR.flip b{animation-name:swimF}
@keyframes swim{50%{transform:translateY(-1.1rem) rotate(6deg)}}
@keyframes swimF{from,to{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-1.1rem) rotate(6deg)}}
.sun{animation:spin 14s linear infinite}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.rain{animation:fall 1.2s linear infinite}
.scene svg{position:absolute;left:0;width:200%;animation:wave linear infinite}
@keyframes wave{to{transform:translateX(-50%)}}
.home{z-index:1}.home .card{background:rgba(255,255,255,.84);max-width:36rem;padding:.8rem 1.4rem;gap:.35rem}.home h1{font-size:2.9rem}.home h1 span[style*="2.4rem"]{font-size:1.8rem!important}.home svg.bob{width:4rem!important}.home p{font-size:1.1rem}.home p.small{font-size:.9rem}

.title span{display:inline-block;animation:letter 2.4s ease-in-out infinite}
@keyframes letter{0%,40%,100%{transform:none;color:var(--navy)}20%{transform:translateY(-.5rem);color:var(--turq)}}
.home .primary{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .7rem rgba(255,210,63,.45)}}
</style>
</head>
<body>
<div id="app">
<div id="bar"></div>
<div id="view"></div>
</div>
<script>
'use strict';
/* ===== 1. CONFIG ===== */
const FB={project:'maths-penalty-cup',key:'AIzaSyAMsz-GB8WmGNUYjod6fquQJMYBQPJeOGs'};
const fbUrl=c=>`https://firestore.googleapis.com/v1/projects/${FB.project}/databases/(default)/documents/classes/${c}?key=${FB.key}`;
const fmtC=c=>c.slice(0,4)+'-'+c.slice(4);
const RANKS=['Water Rookie','River Explorer','Ocean Guardian','Water Scientist','Hydrosphere Hero'];
const MISSIONS=[]; /* filled by the mission files */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let prefs=Object.assign({sound:true,music:true,full:false},store.get('hy_prefs',{}));
const savePrefs=()=>store.set('hy_prefs',prefs);

/* ===== 2. AUDIO (Web Audio only) ===== */
const Snd={ctx:null,amb:null,timer:null,
 init(){try{if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;this.ctx=new A()}if(this.ctx.state==='suspended')this.ctx.resume();this.music()}catch(e){}},
 tone(f,d,t=0,v=.12,type='sine'){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.05)},
 noise(sec){const c=this.ctx,b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s},
 play(n){if(!prefs.sound||!this.ctx)return;try{
  if(n==='click')this.tone(520,.08,0,.08,'triangle');
  if(n==='good'){this.tone(660,.14);this.tone(990,.2,.09)}
  if(n==='bad'){this.tone(240,.22,0,.1,'triangle');this.tone(190,.28,.12,.1,'triangle')}
  if(n==='splash'){const c=this.ctx,s=this.noise(.5),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime;f.type='bandpass';f.frequency.setValueAtTime(2400,t);f.frequency.exponentialRampToValueAtTime(300,t+.45);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.48);s.connect(f).connect(g).connect(c.destination);s.start()}
  if(n==='badge')[523,659,784,1047].forEach((f,i)=>this.tone(f,.28,i*.11));
  if(n==='party')[523,523,523,659,784,659,784,1047].forEach((f,i)=>this.tone(f,.25,i*.14,.14,'triangle'));
 }catch(e){}},
 music(){const c=this.ctx;if(!c)return;
  if(prefs.music&&!this.amb){const s=this.noise(4),f=c.createBiquadFilter(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();s.loop=true;f.type='lowpass';f.frequency.value=420;g.gain.value=.045;l.frequency.value=.12;lg.gain.value=.03;l.connect(lg).connect(g.gain);s.connect(f).connect(g).connect(c.destination);s.start();l.start();this.amb={s,l,g};
   const N=[262,294,330,392,440,523];let i=0;this.timer=setInterval(()=>{if(document.hidden)return;this.tone(N[[0,2,3,4,3,2,5,3,1,2,4,2][i++%12]],.9,0,.028)},700)}
  if(!prefs.music&&this.amb){try{this.amb.s.stop();this.amb.l.stop();this.amb.g.disconnect()}catch(e){}clearInterval(this.timer);this.amb=null}}
};
addEventListener('pointerdown',()=>Snd.init(),{once:true});
document.addEventListener('click',e=>{if(e.target.closest('button'))Snd.play('click')});

/* ===== 3. FIREBASE CLASS LOADER (same logic as Maths Champion) ===== */
const CC={code:'',lib:null,cls:'',msg:'',busy:false};
try{CC.code=localStorage.getItem('pk_code')||''}catch(e){}
async function loadCode(c){
 c=(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(c.length!=8){CC.msg='A class code has 8 letters and numbers.';return showSetup()}
 CC.busy=true;CC.msg='Loading...';showSetup();
 try{
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  const r=await fetch(fbUrl(c),{signal:ctl.signal});clearTimeout(to);
  if(!r.ok){CC.msg=r.status==404?'Code not found. Check it and try again.':'Could not load (error '+r.status+').'}
  else{
   let lib=null;try{const j=await r.json();lib=JSON.parse(j.fields.lib.stringValue)}catch(e){}
   if(!lib||typeof lib!=='object'||Array.isArray(lib))CC.msg='This code has data the game cannot read. Open your class list and save it again.';
   else{CC.lib=lib;CC.code=c;try{localStorage.setItem('pk_code',c)}catch(e){}
    const ks=Object.keys(lib);CC.cls=ks.length==1?ks[0]:(Object.prototype.hasOwnProperty.call(lib,CC.cls)?CC.cls:'');CC.msg=ks.length?'':'That code has no classes yet.'}
  }
 }catch(e){CC.msg='Could not reach the cloud. Check the internet and try again.'}
 CC.busy=false;showSetup();
}
/* returns {list, repeats}. Same rule as Maths Champion: first c.n groups, one name per line, repeated names kept once */
function readClass(k){
 const c=CC.lib&&CC.lib[k],list=[],seen=new Set();let repeats=[];
 if(c&&Array.isArray(c.g))c.g.slice(0,c.n).forEach(g=>String((g&&g.txt)||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!seen.has(n)){seen.add(n);list.push({n,team:g.name})}else repeats.push(n)}));
 return{list,repeats};
}

/* ===== 4. SESSION MANAGER ===== */
let SES=store.get('hy_session',null); /* {code,cls,names,done,skip,current,results} */
if(SES&&!(Array.isArray(SES.names)&&Array.isArray(SES.done)&&Array.isArray(SES.skip)))SES=null;
const saveSes=()=>SES?store.set('hy_session',SES):store.del('hy_session');
const remaining=()=>SES.names.filter(n=>!SES.done.includes(n)&&!SES.skip.includes(n));
let preview=null; /* teacher preview turn, never saved */
const cur=()=>preview||(SES&&SES.current);
if(SES&&!SES.adv){SES.adv={m:0,round:1};SES.current=null}
const newTurn=(name,m=0)=>({name,m,mission:m,done:false,pts:0,gems:0,right:0,total:0,badges:[],quizDone:false,start:Date.now()});

/* ===== 5. SCREEN HELPERS ===== */
let epoch=0,inPlay=false;
const later=(fn,ms)=>{const e=epoch;setTimeout(()=>{if(e===epoch)fn()},ms)};
function view(html,play=false){epoch++;inPlay=play;closeModal();$('.ghost')&&$$('.ghost').forEach(g=>g.remove());$('#view').innerHTML=html;drawBar()}
function bubbles(){let h='';for(let i=0;i<12;i++){const s=1+Math.random()*2.5;h+=`<span class="bubble" style="left:${rnd(100)}%;width:${s}rem;height:${s}rem;animation-duration:${8+rnd(10)}s;animation-delay:-${rnd(12)}s"></span>`}return h}
function modal(html){closeModal();const d=document.createElement('div');d.id='modal';d.innerHTML=`<div class="card col">${html}</div>`;document.body.appendChild(d)}
function closeModal(){const m=$('#modal');if(m)m.remove()}
function ask2(msg,yes,fn){modal(`<h2>${msg}</h2><div class="row"><button class="danger" id="yes">${yes}</button><button id="no">Cancel</button></div>`);$('#yes').onclick=()=>{closeModal();fn()};$('#no').onclick=openTeacher}
function confetti(){for(let i=0;i<70;i++){const c=document.createElement('i');c.className='confetti';c.style.cssText=`left:${rnd(100)}vw;background:${['#ffd23f','#ff6f61','#14b8b8','#fff','#1273b8'][i%5]};animation-delay:${Math.random()*.9}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}
function drawBar(){
 const t=inPlay?cur():null;
 let h=`<button id="bBack">${inPlay?'⬅ Map':'🏠 Menu'}</button>`;
 if(t){h+=`<span id="who">🧭 ${esc(t.name)}</span><div id="dots" aria-label="Mission progress">${MISSIONS.map((m,i)=>`<i class="${i<t.m?'d':i===t.m?'c':''}">${i+1}</i>`).join('')}</div><span class="stat">💎 ${t.gems}</span><span class="stat">⭐ ${t.pts}</span>`}
 else h+='<span style="margin-right:auto;font-weight:bold">Hydrosphere – The Great Water Rescue</span>';
 h+=`<button id="bSnd" aria-label="Sound effects">${prefs.sound?'🔊':'🔇'} Sound</button><button id="bMus" aria-label="Music">${prefs.music?'🎵':'🚫'} Music</button><button id="bFull" aria-label="Full screen">⛶</button><button id="bTeach">👩‍🏫 Hold</button>`;
 $('#bar').innerHTML=h;
 $('#bBack').onclick=()=>{if(!inPlay)return showHome();if($('.mapsvg'))modal(`<h2>Leave this turn?</h2><p>Progress is saved. You can resume later.</p><div class="row"><button class="danger" id="lv">Go to menu</button><button id="st">Keep playing</button></div>`),$('#lv').onclick=showHome,$('#st').onclick=closeModal;else showMap()};
 $('#bSnd').onclick=()=>{prefs.sound=!prefs.sound;savePrefs();$('#bSnd').textContent=(prefs.sound?'🔊':'🔇')+' Sound'};
 $('#bMus').onclick=()=>{prefs.music=!prefs.music;savePrefs();Snd.init();Snd.music();$('#bMus').textContent=(prefs.music?'🎵':'🚫')+' Music'};
 $('#bFull').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
 const tb=$('#bTeach');let hold;
 tb.onpointerdown=()=>{tb.textContent='👩‍🏫 …';hold=setTimeout(()=>{tb.textContent='👩‍🏫 Hold';openTeacher()},800)};
 tb.onpointerup=tb.onpointerleave=tb.onpointercancel=()=>{clearTimeout(hold);tb.textContent='👩‍🏫 Hold'};
 tb.onkeydown=e=>{if(e.key==='Enter')openTeacher()};
}
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('touchmove',e=>{if(!e.target.closest('.screen,#modal .card'))e.preventDefault()},{passive:false});

/* ===== 6. HOME, SETUP, SELECTION ===== */
function homeScene(){
 const it=(e,cls,top,size,dur,delay,left)=>`<i class="${cls}" style="top:${top}%;font-size:${size}rem;${dur?`animation-duration:${dur}s;animation-delay:-${delay}s;`:''}${left!=null?`left:${left}%;`:''}"><b>${e}</b></i>`;
 const wave=(top,col,dur)=>`<svg viewBox="0 0 1600 100" preserveAspectRatio="none" style="top:${top}%;height:${101-top}%;animation-duration:${dur}s"><path d="M0 12Q100 0 200 12T400 12T600 12T800 12T1000 12T1200 12T1400 12T1600 12V100H0Z" fill="${col}"/></svg>`;
 let h='<div class="scene" aria-hidden="true">';
 h+=it('☀️','sun',4,5,0,0,84)+it('☁️','goR',3,6,34,5)+it('☁️','goR',15,4,48,30)+it('☁️','goL',8,5,40,18)+it('🕊️','goL flip',22,2.5,19,4);
 [[8,0],[11,.4],[14,.8],[88,.2],[91,.6]].forEach(([l,d])=>h+=`<i class="rain" style="left:${l}%;top:24%;font-size:1.4rem;animation-delay:-${d}s">💧</i>`);
 h+=wave(62,'rgba(41,182,246,.55)',9)+it('⛵','goR',55,5,26,8)+it('🚢','goL',57,5,36,22)+wave(70,'rgba(18,115,184,.7)',7);
 h+=it('🐠','goL',74,3.5,17,3)+it('🐟','goL',86,3,13,9)+it('🐬','goL',65,4.5,15,11)+it('🐢','goR flip',80,3.8,31,12)+it('🐡','goR flip',90,3,21,2)+it('🐙','goL',78,3.5,29,24)+it('🦀','goR',92,2.6,38,27);
 [3,12,22,76,86,95].forEach((l,i)=>h+=`<i class="sway" style="left:${l}%;bottom:0;font-size:${3.5+i%3}rem;animation-delay:-${i*.6}s">🌿</i>`);
 return h+bubbles()+'</div>';
}
const waveText=(s,start=0)=>[...s].map((c,i)=>c===' '?' ':`<span style="animation-delay:${(i+start)*.09}s">${c}</span>`).join('');
function showHome(){preview=null;
 let h=`${homeScene()}<div class="screen home"><div class="card col"><svg viewBox="0 0 100 100" style="width:7rem" class="bob"><path d="M50 5C50 5 18 45 18 64a32 32 0 0 0 64 0C82 45 50 5 50 5Z" fill="#14b8b8"/><circle cx="39" cy="62" r="5" fill="#082f55"/><circle cx="61" cy="62" r="5" fill="#082f55"/><path d="M38 76q12 11 24 0" stroke="#082f55" stroke-width="4" fill="none" stroke-linecap="round"/></svg>

let M=null; /* running mission */
/* if a mission is left half-way and started again, its half-way points are removed first */
function snapshot(t){if(t.base)Object.assign(t,t.base);t.base={pts:t.pts,right:t.right,total:t.total}}

function runStep(){

 view(`<div class="act" style="background:${m.bg}"><div class="ask" id="ask"></div><div class="stage" id="stage"></div><div class="tray" id="tray"></div></div>`,true);

}
function learnCard(text){

/* one scored decision. missed = student already got this item wrong once */
function good(msg,missed){const t=cur();t.total++;if(!missed)t.right++;t.pts+=missed?5:10;Snd.play('good');if(msg)feedback(true,'✔ '+msg);drawBar()}

function completeMission(){
 const t=cur(),m=M.def,g=M.mist===0?3:M.mist<=2?2:1;t.gems+=g;t.pts+=50;award(m.badge);if(!M.mist)award('✨ Sharp Eyes');t.m=M.i+1;t.done=true;delete t.base;

/* ===== 10. DRAG AND DROP ENGINE (mouse, touch, and tap-then-tap) ===== */
let picked=null;
function draggable(el,onDrop){
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();let moved=false,ghost=null;const sx=e.clientX,sy=e.clientY,id=e.pointerId,ep=epoch;
  const mv=ev=>{if(ev.pointerId!==id)return;if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<10)return;
   if(!moved){moved=true;ghost=el.cloneNode(true);ghost.classList.add('ghost');document.body.appendChild(ghost);el.style.opacity=.35}
   ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'};
  const up=ev=>{if(ev.pointerId!==id)return;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(ghost)ghost.remove();el.style.opacity='';
   if(ep!==epoch||ev.type==='pointercancel')return;
   if(moved){const hit=document.elementFromPoint(ev.clientX,ev.clientY),z=hit&&hit.closest('[data-zone]');if(z){clearPick();onDrop(el,z)}}
   else{const was=el.classList.contains('sel');clearPick();if(!was){el.classList.add('sel');picked={el,onDrop};Snd.play('click')}}};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
 });
}
function clearPick(){if(picked){picked.el.classList.remove('sel');picked=null}$$('.tile.sel').forEach(e=>e.classList.remove('sel'))}
document.addEventListener('click',e=>{const z=e.target.closest('[data-zone]');if(z&&picked&&document.contains(picked.el)){const p=picked;clearPick();p.onDrop(p.el,z)}});

/* items:[{t:label, z:zoneKey, why:explanation}] ; zones already in the DOM with data-zone */
function placeGame(api,items,learn,opt={}){

  done.add(id);g.querySelector('.water').innerHTML=id==='shower'?`<text x="${620}" y="280" text-anchor="middle" font-size="60">🪣</text>`:'';g.querySelector('.box').setAttribute('stroke','#1f9d61');g.querySelector('.lab').textContent=id==='shower'?'Bucket bath ✔':'Fixed ✔';
  good({leak:'Leak repaired. Every drop counts!',open:'Tap closed.',shower:'A bucket bath saves water.'}[id],false);if(done.size===3)later(()=>a.done('Repair leaks, <b>close taps</b>, and take water in a <b>bucket</b> for bathing instead of using a shower.'),1000)});
}

 {q:'You have finished washing vessels. What next?',icon:'🍽️',opts:['Check that the tap is closed','Leave the tap running','Open one more tap'],a:0,why:'After washing vessels, check that the taps are closed.'},

function m6Rain(a){
 const S=[['roof','Rooftop','🏠',30,'The ROOFTOP catches the rain first.'],['pipe','Collection pipes','🟰',225,'PIPES carry rainwater down from the roof.'],['filter','Filter','🧽',420,'The FILTER comes next. It removes leaves and dirt.'],['tank','Storage tank','🛢️',615,'The STORAGE TANK keeps the clean water for later use.']];

 a.stage.innerHTML=`<svg viewBox="0 0 800 380"><rect width="800" height="380" rx="20" fill="#bfe9f7"/><rect y="320" width="800" height="60" fill="#8fd18a"/><g id="rain"></g>${S.map((s,i)=>`<g data-zone="${s[0]}" id="z-${s[0]}"><rect x="${s[3]}" y="130" width="155" height="170" rx="16" fill="#fff" stroke="#1273b8" stroke-width="5" stroke-dasharray="11 8"/><text class="lab" x="${s[3]+77}" y="228" text-anchor="middle" font-size="40" font-weight="bold" fill="#1273b8">${i+1}</text></g>${i<3?`<path id="ln${i}" d="M${s[3]+155} 215h40" stroke="#999" stroke-width="12"/>`:''}`).join('')}</svg>`;
 const items=S.map(s=>({t:s[2]+' '+s[1],z:s[0],why:s[4]}));
 placeGame(a,items,'<b>Rooftop</b> catches rain → <b>pipes</b> carry it → <b>filter</b> cleans out leaves and dirt → <b>storage tank</b> saves it. Ask your teachers to help build one at school!',
 {onPlace:(it,z)=>{const s=S.find(x=>x[0]===it.z),x=s[3]+77,pic={roof:`<path d="M${x-60} 205L${x} 160L${x+60} 205Z" fill="#ff6f61"/><rect x="${x-45}" y="205" width="90" height="55" fill="#ffe8b6"/>`,pipe:`<path d="M${x-60} 180H${x}V250H${x+60}" fill="none" stroke="#5b6b7a" stroke-width="22"/>`,filter:`<path d="M${x-50} 165H${x+50}L${x+18} 255H${x-18}Z" fill="#d9a441"/><circle cx="${x-12}" cy="195" r="7" fill="#6b4"/><circle cx="${x+15}" cy="215" r="6" fill="#753"/>`,tank:`<rect x="${x-50}" y="160" width="100" height="105" rx="12" fill="#335c7d"/><rect id="fill" x="${x-42}" y="257" width="84" height="0" fill="#29b6f6"/>`}[it.z];
   z.innerHTML=`<rect x="${s[3]}" y="130" width="155" height="170" rx="16" fill="#fff" stroke="#1f9d61" stroke-width="5"/>${pic}<text x="${x}" y="290" text-anchor="middle" font-size="18" font-weight="bold" fill="#082f55">${it.t.replace(/^\S+ /,'')}</text>`;
   if(++n===4){$('#rain').innerHTML=[...Array(14)].map((_,i)=>`<text class="fall" x="${10+i*14}" y="${40+(i%3)*20}" font-size="20" style="animation-delay:-${i*.17}s">💧</text>`).join('')+'<text x="40" y="55" font-size="60">🌧️</text>';
    [0,1,2].forEach(i=>{const l=$('#ln'+i);l.setAttribute('stroke','#29b6f6');l.classList.add('flow')});let h=0;const rise=()=>{h+=3;$('#fill').setAttribute('height',h);$('#fill').setAttribute('y',257-h);if(h<90)later(rise,60)};rise();Snd.play('splash')}}});

}

/* ===== MISSION 7: WATER CYCLE ===== */
const scene=(extra,night)=>`<svg viewBox="0 0 800 420" style="touch-action:none"><rect width="800" height="420" rx="20" fill="${night?'#7fa9c9':'#bfe9f7'}"/><path d="M800 420V150L690 270L610 210L470 340L430 420Z" fill="#7a9b62"/><path d="M690 270Q620 300 560 320T430 365" stroke="#2aa6d8" stroke-width="16" fill="none"/><path d="M690 270Q620 300 560 320T430 365" stroke="#bfefff" stroke-width="4" fill="none" class="flow"/><path d="M0 340q55-16 110 0t110 0t110 0t110 0V420H0Z" fill="#1783b8"/><path d="M455 390H800V420H455Z" fill="#8a5a34"/>${extra}</svg>`;
const cloud=(x,y,s=1,c='#fff')=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-70 20a30 30 0 0 1 20-48a45 45 0 0 1 80-8a35 35 0 0 1 45 56Z" fill="${c}"/></g>`;
/* drag the droplet (or tap the destination) */
function ride(svg,start,inGoal,onArrive,onMiss){
 const d=svg.querySelector('#me');let pos=start.slice(),on=false,fin=false;
 const put=p=>{pos=p;d.setAttribute('transform',`translate(${p[0]} ${p[1]})`)};put(pos);
 const at=e=>{const p=svgPt(svg,e);return[Math.max(30,Math.min(770,p.x)),Math.max(45,Math.min(390,p.y))]};
 svg.onpointerdown=e=>{if(fin)return;on=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}d.style.transition='';const p=at(e);if(Math.hypot(p[0]-pos[0],p[1]-pos[1])<80)put(p)};
 svg.onpointermove=e=>{if(on&&!fin)put(at(e))};
 svg.onpointerup=e=>{if(!on||fin)return;on=false;put(at(e));if(inGoal(pos[0],pos[1])){fin=true;onArrive()}else onMiss&&onMiss()};
 svg.onpointercancel=()=>on=false;
}
function m7Evap(a){
 let heat=0;a.ask('Stage I: You are a water droplet in the ocean! Tap the Sun 3 times to feel its heat.');
 a.stage.innerHTML=scene(`<g id="sunb" style="cursor:pointer"><circle id="glow" cx="110" cy="90" r="55" fill="#ffd23f" opacity=".35"/><circle cx="110" cy="90" r="45" fill="#ffd23f"/><text x="110" y="107" text-anchor="middle" font-size="46">☀️</text></g><rect x="220" y="15" width="360" height="110" rx="16" fill="rgba(255,255,255,.35)" stroke="#fff" stroke-width="4" stroke-dasharray="10 8"/><text x="400" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#082f55">SKY</text><g id="vap"></g><g id="me" style="cursor:grab">${drop()}</g>`);
 const svg=a.stage.querySelector('svg'),me=$('#me');me.setAttribute('transform','translate(260 370)');
 $('#sunb').onclick=()=>{if(heat>=3)return;heat++;Snd.play('click');$('#glow').setAttribute('r',55+heat*18);$('#vap').insertAdjacentHTML('beforeend',`<text class="fall" style="animation-direction:reverse;animation-duration:2s" x="${80+heat*90}" y="290" font-size="34">♨️</text>`);
  if(heat<3)return feedback(true,`Getting warmer… ${heat} of 3`);
  a.ask('You are turning into water vapour! Drag yourself UP into the sky.');
  ride(svg,[260,370],(x,y)=>y<130&&x>210&&x<590,()=>{me.style.opacity=.65;good('You rose into the air as vapour. This is EVAPORATION.',false);a.done('<b>Evaporation:</b> heat from the Sun falls on oceans, seas, lakes and rivers. Water slowly evaporates as <b>vapour</b> into the air.')},()=>feedback(false,'Vapour rises. Move up into the SKY box.'))};
}
function m7Cond(a){
 let got=0;a.ask('Stage II: It is cool up here! You turn back into a tiny liquid drop. Drag yourself to touch all 3 friend droplets.');
 const F=[[230,120],[420,80],[590,160]];
 a.stage.innerHTML=scene(`<text x="720" y="70" font-size="50">❄️</text>${F.map((f,i)=>`<g id="f${i}">${drop(f[0],f[1],.7)}</g>`).join('')}<g id="cl"></g><g id="me" style="cursor:grab">${drop()}</g>`,true);
 const svg=a.stage.querySelector('svg');
 const go=p=>ride(svg,p,(x,y)=>F.some((f,i)=>$('#f'+i)&&Math.hypot(x-f[0],y-f[1])<65),()=>{const m=$('#me').getAttribute('transform').match(/-?[\d.]+/g).map(Number);F.forEach((f,i)=>{const e=$('#f'+i);if(e&&Math.hypot(m[0]-f[0],m[1]-f[1])<65)e.remove()});got=3-F.filter((_,i)=>$('#f'+i)).length;Snd.play('splash');
   if(got<3){feedback(true,`Droplets joined: ${got} of 3`);return go(m)}
   good('Together you can form a cloud!',false);a.ask('Now call the wind to move the liquid around.');a.tray.innerHTML='<button class="primary" id="wind">🌬️ Blow wind</button>';
   $('#wind').onclick=()=>{$('#wind').disabled=true;$('#me').style.opacity=0;$('#cl').innerHTML=`<g class="drift">${cloud(400,130,1.8)}<text x="360" y="140" font-size="28" font-weight="bold" fill="#082f55">CLOUD</text></g><text x="100" y="150" font-size="60">🌬️</text>`;Snd.play('splash');a.done('<b>Condensation:</b> vapour rises, the cooler temperature cools it and turns it back into <b>liquid</b>. <b>Wind</b> moves the liquid around and <b>clouds</b> form.')}},()=>feedback(false,'Move onto one of the other droplets.'));
 go([100,230]);
}
function m7Rain(a){
 let n=0;a.ask('Stage III: Tap the WIND 3 times to make the cloud particles COLLIDE (crash).');
 a.stage.innerHTML=scene(`<g id="c1">${cloud(220,110,1.1)}</g><g id="c2">${cloud(580,110,1.1)}</g><g id="fx"></g><g id="me" style="cursor:grab;display:none">${drop()}</g>`,true);
 a.tray.innerHTML='<button class="primary" id="wind">🌬️ Wind</button>';
 const svg=a.stage.querySelector('svg');
 $('#wind').onclick=()=>{n++;Snd.play('splash');$('#c1').setAttribute('transform',`translate(${n*45} 0)`);$('#c2').setAttribute('transform',`translate(${-n*45} 0)`);if(n<3)return;
  $('#c1').removeAttribute('transform');$('#c2').remove();$('#c1').innerHTML=cloud(400,110,1.8,'#6c7f92');good('The particles collided! Now we have a rain-bearing cloud.',false);a.ask('The temperature decides how water falls. Try the weather buttons, then continue.');
  const tried=new Set();const T={'🌧️ Warmer air: Rain':'💧','❄️ Very cold: Snow':'❄️','🧊 Icy lumps: Hail':'⚪'};
  a.tray.innerHTML=Object.keys(T).map((k,i)=>`<button class="w" data-i="${i}">${k}</button>`).join('')+'<button class="primary" id="fall" disabled>Now fall! ⬇</button>';
  $$('.w').forEach(b=>b.onclick=()=>{const e=Object.values(T)[+b.dataset.i];tried.add(e);$('#fx').innerHTML=[...Array(12)].map((_,i)=>`<text class="fall" x="${270+i*22}" y="${180+(i%3)*25}" font-size="26" style="animation-delay:-${i*.21}s">${e}</text>`).join('');if(tried.size>=2)$('#fall').disabled=false});
  $('#fall').onclick=()=>{a.tray.innerHTML='';a.ask('You are a raindrop! Drag yourself DOWN to the Earth.');$('#me').style.display='';
   ride(svg,[400,180],(x,y)=>y>300,()=>{good('Splash! You fell back to Earth. This is PRECIPITATION.',false);Snd.play('splash');a.done('<b>Precipitation:</b> wind makes cloud particles <b>collide</b> (crash). They become rain-bearing clouds and water falls to Earth as <b>rain, hail, snow or dew</b>, depending on the temperature.')},()=>feedback(false,'Rain falls down. Drag the drop to the ground or sea.'))}};
}
function m7Run(a){
 const round=k=>{a.ask(k?'One more droplet! This time, soak INTO THE SOIL (infiltration).':'Stage IV: You landed on a hill. Drag yourself into the RIVER (runoff).');
  a.stage.innerHTML=scene(`<circle cx="${k?630:545}" cy="${k?390:325}" r="46" fill="rgba(255,210,63,.45)" stroke="#ffd23f" stroke-width="5" class="bob"/><text x="${k?630:540}" y="${k?345:270}" text-anchor="middle" font-size="26" font-weight="bold" fill="#082f55">${k?'SOIL':'RIVER'}</text>${k?'<text x="690" y="360" font-size="40">🌱</text>':''}<g id="me" style="cursor:grab">${drop(0,0,.8)}</g>`);
  ride(a.stage.querySelector('svg'),[750,120],(x,y)=>k?(x>455&&y>350):Math.hypot(x-545,y-325)<70,()=>{Snd.play('splash');if(!k){good('You run off along the river to the ocean. That is RUNOFF.',false);later(()=>round(1),1700)}else{good('You soaked into the soil. That is INFILTRATION.',false);a.done('<b>Runoff and Infiltration:</b> water either <b>runs off</b> into rivers, oceans and over the ground, or is <b>absorbed into the soil</b>. Then the cycle continues!')}},()=>feedback(false,k?'Drag the drop down into the brown soil.':'Follow the blue river on the hill.'))};
 round(0);
}
const STAGES=[['1','☀️ Evaporation','Evaporation is first: the Sun heats water and it rises as vapour.'],['2','☁️ Condensation','Condensation is second: vapour cools into liquid and clouds form.'],['3','🌧️ Precipitation','Precipitation is third: water falls from clouds.'],['4','🌱 Runoff and Infiltration','Runoff and infiltration is fourth: water flows away or soaks into soil.']];
function m7Order(a){
 a.ask('Put the four stages of the water cycle in the correct order.');
 bins(a,STAGES.map((s,i)=>({k:s[0],label:'Stage '+['I','II','III','IV'][i],art:'<div style="font-size:3rem">➡️</div>'})));
 placeGame(a,STAGES.map(s=>({t:s[1],z:s[0],why:s[2]})),'<b>I Evaporation → II Condensation → III Precipitation → IV Runoff and Infiltration</b>, and then it begins again. Water changes between solid, liquid and gas in this cycle.');
}
function m7Show(a){
 a.ask('You saved the water cycle! Watch water travel round and round.');
 const lab=(x,y,t)=>`<rect x="${x-135}" y="${y-24}" width="270" height="34" rx="17" fill="#fff"/><text x="${x}" y="${y}" text-anchor="middle" font-size="19" font-weight="bold" fill="#082f55">${t}</text>`;
 a.stage.innerHTML=scene(`<circle cx="70" cy="70" r="38" fill="#ffd23f" class="bob"/>${[0,1,2,3].map(i=>`<text class="fall" style="animation-direction:reverse;animation-duration:2s;animation-delay:-${i*.5}s" x="${90+i*55}" y="260" font-size="30">♨️</text>`).join('')}<g class="drift">${cloud(430,100,1.4)}${cloud(620,100,1,'#6c7f92')}</g>${[...Array(8)].map((_,i)=>`<text class="fall" x="${575+i*15}" y="${150+(i%3)*18}" font-size="18" style="animation-delay:-${i*.19}s">💧</text>`).join('')}<path d="M180 210Q220 90 330 80" fill="none" stroke="#fff" stroke-width="8" class="flow"/><path d="M690 140Q760 190 700 250" fill="none" stroke="#fff" stroke-width="8" class="flow"/>${lab(150,200,'1 Evaporation')}${lab(300,40,'2 Condensation')}${lab(650,205,'3 Precipitation')}${lab(520,395,'4 Runoff and Infiltration')}<g><animateMotion dur="8s" repeatCount="indefinite" path="M220 350C200 200 270 90 430 90S660 100 640 220S560 330 430 365S250 380 220 350"/>${drop(0,0,.6)}</g>`);
 a.tray.innerHTML='<button class="primary" id="fin">Finish the mission ✔</button>';Snd.play('party');$('#fin').onclick=()=>{$('#fin').disabled=true;a.done('The water cycle <b>never stops</b>. Water keeps moving on, below and above the surface of the Earth.')};
}

/* ===== FINAL CHALLENGE (textbook evaluation, pages 122–123) ===== */
function qMatch(a){

 placeGame(a,P.map((p,i)=>({t:p[1],z:'m'+i,why:`${p[0]} ↔ ${p[1]}`})),'Great matching!');
}

 machine(a,[{k:'t',label:'TRUE',art:'<div style="font-size:4.5rem">👍</div>'},{k:'f',label:'FALSE',art:'<div style="font-size:4.5rem">👎</div>'}],[
 {t:'About 97% of water on the earth is salt water.',z:'t',why:'True: about 97% is salt water.'},{t:'Water is not necessary for our basic needs.',z:'f',why:'False: we need water to drink, bathe and cook.'},{t:'Water in the sea is sweet.',z:'f',why:'False: sea water is salty.'},{t:'We should keep the tap open throughout while washing utensils.',z:'f',why:'False: this wastes water. Close the tap.'},{t:'We should save water.',z:'t',why:'True: fresh water is limited.'}],'You know how to tell fact from mistake!');
}
function qChoose(a,full){

 $('#go').onclick=()=>{snapshot(cur());M={i:-1,def:{bg:'linear-gradient(#cdb8ff,#5fc8dc)'},step:0,mist:0,steps:prefs.full?[qChoose,qMatch,qTF].map(f=>a=>f(a,true)):[one(a=>qChoose(a,false),qMatch,qTF)]};runStep()};
}
